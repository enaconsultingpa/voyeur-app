<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/voyeur-favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>Voyeur — Members</title>
  <!-- QR generation (member redemption codes) and QR scanning (staff
       fulfillment) — loaded from a CDN as plain scripts rather than npm
       packages so the build never depends on resolving/locking them.
       Both expose a global (window.QRCode / window.jsQR); App.jsx waits
       for these to be ready before using them.
       NOTE: the "qrcode" npm package (soldair/node-qrcode) does NOT ship a
       prebuilt browser bundle — cdn.jsdelivr.net/npm/qrcode@.../build/... is
       a 404 (confirmed live), which is why QR codes were rendering as a
       blank card. "qrcodejs" (davidshimjs) is a different, older library
       that does ship a real browser build and defines the same window.QRCode
       global, so only this URL needed to change — see RewardQrCode in
       App.jsx for the (slightly different) usage. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
